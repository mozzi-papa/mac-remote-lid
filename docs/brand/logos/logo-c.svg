<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none" role="img" aria-labelledby="logo-c-title">
  <title id="logo-c-title">원격지킴이 로고 C안: 한글 워드마크 중심</title>
  <!-- 좌측 보조 심벌: 메뉴 막대 토글 스위치와 이전 상태 기준점 -->
  <g transform="translate(8, 12)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#1C2026" stroke="#313742" stroke-width="1.5"/>
    <!-- 슬롯 트랙 -->
    <rect x="9" y="15" width="30" height="18" rx="9" fill="#121519" stroke="#8E98A4" stroke-width="2"/>
    <!-- 이전 설정 기준점 (되돌아갈 위치 표시) -->
    <circle cx="18" cy="24" r="2.25" fill="#687280"/>
    <!-- 활성 상태 노브 -->
    <circle cx="30" cy="24" r="5" fill="#32D74B"/>
  </g>
  <!-- 한글 워드마크 (시스템 글꼴 기반 배치 시안, 최종 배포 시 윤곽선 변환 대상) -->
  <text x="70" y="38" fill="#1C2026" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', sans-serif" font-size="27" font-weight="700" letter-spacing="-0.8">원격지킴이</text>
  <!-- 우측 상단 작동 상태 점 -->
  <circle cx="196" cy="20" r="3.5" fill="#28B446"/>
  <!-- 보조 영문 표기 (RemoteLid) -->
  <text x="71" y="55" fill="#5C6672" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4">REMOTELID</text>
  <!-- 구분선 및 핵심 역할 태그 -->
  <line x1="158" y1="47" x2="158" y2="57" stroke="#C5CCD6" stroke-width="1.5" stroke-linecap="round"/>
  <text x="167" y="55" fill="#687280" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="500" letter-spacing="-0.2">macOS 전원 설정 유지·복원</text>
</svg>
